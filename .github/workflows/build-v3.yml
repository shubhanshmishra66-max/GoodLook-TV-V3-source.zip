
name: Build GoodLook TV V3 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract V3 source
        run: |
          mkdir project
          unzip -q GoodLook-TV-V3-source.zip -d project
          ls -la project

      - name: Build V3 APK
        run: gradle -p project assembleDebug

      - name: Upload V3 APK
        uses: actions/upload-artifact@v4
        with:
          name: GoodLook-TV-V3-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
